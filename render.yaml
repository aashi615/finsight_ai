services:
  - type: web
    name: equitylens-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: FINNHUB_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      # Free-tier guard: every LLM request reserves input + completion from the
      # same 7K rolling budget; these are generous per-agent ceilings only.
      - key: GROQ_TPM_LIMIT
        value: "7000"
      - key: GROQ_SAFE_TPM_LIMIT
        value: "7000"
      - key: NEWS_MAX_OUTPUT_TOKENS
        value: "1600"
      - key: MARKET_MAX_OUTPUT_TOKENS
        value: "1400"
      - key: RAG_MAX_OUTPUT_TOKENS
        value: "1200"
      - key: FINAL_MAX_OUTPUT_TOKENS
        value: "1200"
      - key: FINAL_COMPACT_MAX_OUTPUT_TOKENS
        value: "600"
      - key: FINAL_FALLBACK_MAX_OUTPUT_TOKENS
        value: "400"
      - key: CORS_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: equitylens-postgres
          property: connectionString
databases:
  - name: equitylens-postgres
    plan: free
    databaseName: equitylens
    user: equitylens
